# Tests : base H2 en mémoire en mode PostgreSQL, mêmes migrations Flyway — aucune base locale requise (B6)
spring.datasource.url=jdbc:h2:mem:kfokam48;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
