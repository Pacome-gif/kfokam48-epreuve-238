spring.application.name=presence

# Base de données : valeurs de démonstration, surchargées par variables d'environnement (docker compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kfokam48}
spring.datasource.username=${DB_USER:kfokam48}
spring.datasource.password=${DB_PASSWORD:kfokam48}

# Le schéma vient uniquement de Flyway (B5)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Erreurs : jamais de stack trace ni de page par défaut (B4)
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=false

# Une note 12.5 ne doit pas être tronquée silencieusement en 12 (RG8)
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
